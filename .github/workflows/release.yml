name: Package and Publish VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$version'."
          }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm.cmd ci
      - name: Build Windows x64 USB topology helper
        run: npm.cmd run build:native
      - name: Run tests
        run: npm.cmd test
      - name: Package and verify VSIX
        run: npm.cmd run package:verify
      - name: Check source syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path source -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath release/usb-device-tree.vsix -Algorithm SHA256).Hash
          "usb-device-tree.vsix SHA256 $hash" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Save verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: release/usb-device-tree.vsix
          if-no-files-found: error
      - name: Publish tagged version to Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) { throw 'VSCE_PAT repository secret is not configured.' }
          .\node_modules\.bin\vsce.cmd publish --packagePath release\usb-device-tree.vsix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Marketplace version and VSIX SHA-256
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          $expectedHash = (Get-FileHash -LiteralPath release/usb-device-tree.vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $listing = .\node_modules\.bin\vsce.cmd show brian-chang.usb-device-tree --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Marketplace readback failed.' }
            $published = $listing.versions | Where-Object { $_.version -eq $version } | Select-Object -First 1
            $publishedHash = ($published.properties | Where-Object { $_.key -eq 'Microsoft.VisualStudio.Services.VsixSha256' } | Select-Object -First 1).value
            if ($publishedHash -and $publishedHash.ToLowerInvariant() -eq $expectedHash) {
              "Marketplace version $version matches VSIX SHA-256 $expectedHash" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            Start-Sleep -Seconds 15
          }
          throw "Marketplace version $version did not match VSIX SHA-256 $expectedHash after 12 checks."
